<!doctype html>
<html lang="{lang}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{doc_title} &mdash; Veil</title>
  <style>
    :root {
      --bg: #09090b;
      --card-bg: rgba(24, 24, 27, 0.6);
      --border: rgba(255, 255, 255, 0.08);
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.5);
      --success: #22c55e;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.12), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(147, 51, 234, 0.12), transparent 25%);
      color: var(--text-main);
      overflow: hidden;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      text-align: center;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(20px);
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-container {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .veil-logo {
      width: 64px;
      height: 64px;
    }

    .veil-path-outer, .veil-path-inner {
      stroke-dasharray: 120;
      stroke-dashoffset: 120;
      animation: draw 1.5s ease-in-out forwards;
    }

    .veil-path-inner {
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation-delay: 0.4s;
    }

    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      color: var(--text-main);
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    /* ── Progress bar ─────────────────────────────────── */
    .progress-wrap {
      margin-bottom: 1.5rem;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #8b5cf6);
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    .progress-fill.solving {
      animation: progressPulse 1.5s ease-in-out infinite;
    }

    @keyframes progressPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .status-text {
      font-size: 0.8rem;
      color: var(--text-muted);
      min-height: 1.2em;
    }

    .status-text.success {
      color: var(--success);
      font-weight: 500;
    }

    .status-text.error {
      color: var(--error);
      font-weight: 500;
    }

    .footer {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      opacity: 0.7;
    }

    .footer svg {
      width: 14px;
      height: 14px;
    }

    /* ── Visible interaction widget (self-hosted, Tier 2 opt-in) ─────── */
    .verify-box {
      margin-bottom: 1.5rem;
    }

    .verify-checkbox {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      padding: 0.85rem 1rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .verify-checkbox:hover {
      border-color: var(--accent);
    }

    .verify-box.checking .verify-checkbox,
    .verify-box.done .verify-checkbox {
      cursor: default;
    }

    .verify-tick {
      flex: 0 0 auto;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid var(--text-muted);
      position: relative;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .verify-box.checking .verify-tick {
      border-color: var(--accent);
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .verify-box.done .verify-tick {
      border-color: var(--success);
      background: var(--success);
    }

    .verify-box.done .verify-tick::after {
      content: "";
      position: absolute;
      left: 6px;
      top: 2px;
      width: 5px;
      height: 10px;
      border: solid var(--bg);
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .verify-box.done .verify-label {
      color: var(--success);
      font-weight: 500;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      {logo_svg}
    </div>

    <h1>{heading}</h1>
    <p>{intro}</p>

    <noscript>
      <p style="color: #ef4444; font-weight: 500;">
        {noscript}
      </p>
    </noscript>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar">
        <div class="progress-fill solving" id="progressFill"></div>
      </div>
      <div class="status-text" id="statusText">{status_verifying}</div>
      <div class="status-text" id="interactPrompt" style="display:none;margin-top:0.5rem;">
        {hint}
      </div>
    </div>

    <div class="verify-box" id="verifyBox" style="display:none;">
      <button type="button" class="verify-checkbox" id="verifyCheckbox">
        <span class="verify-tick" id="verifyTick"></span>
        <span class="verify-label" id="verifyLabel">{verify_label}</span>
      </button>
    </div>

    <div class="footer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
      {footer}
    </div>
  </div>

  <script>
  (function() {
    var NONCE     = "{nonce}";
    var DIFFICULTY = {difficulty};
    var TIER       = {tier};
    // 1 → Tier 2 offers a visible "verify I'm human" checkbox as an auto→manual
    // fallback: it first tries to pass invisibly, and only reveals the checkbox
    // if no real interaction arrives. 0 → invisible passive check only.
    var INTERACTIVE = {interactive};
    var VERIFY_CHECKING = "{verify_checking}";
    var VERIFY_DONE     = "{verify_done}";
    var VERIFY_URL = "/_veil/challenge/verify";
    var BATCH_SIZE = 50000;
    // Tier 2: minimum pointer/touch events before a solution is submitted.
    var MIN_EVENTS = 6;

    var fill   = document.getElementById("progressFill");
    var status = document.getElementById("statusText");
    var prompt = document.getElementById("interactPrompt");
    var verifyBox      = document.getElementById("verifyBox");
    var verifyCheckbox = document.getElementById("verifyCheckbox");
    var verifyLabel    = document.getElementById("verifyLabel");

    // ── Behavioural telemetry (Tier 2 only) ────────────────
    // Captured while the PoW solves; scored server-side. A scripted client
    // that posts a solution without interacting produces no events and fails.
    var behavior = null;
    if (TIER === 2) {
      behavior = {
        count: 0, pathLength: 0, startedAt: now(),
        first: null, last: null, lastX: null, lastY: null,
        startX: 0, startY: 0, endX: 0, endY: 0, lastT: null, dts: []
      };
      prompt.style.display = "block";
      window.addEventListener("pointermove", function (e) { onMove(e.clientX, e.clientY); }, { passive: true });
      window.addEventListener("touchmove", function (e) {
        if (e.touches && e.touches[0]) { onMove(e.touches[0].clientX, e.touches[0].clientY); }
      }, { passive: true });
    }

    // ── Visible interaction widget (Tier 2 auto→manual fallback) ─────────
    // Tier 2 first tries to pass invisibly on the passive telemetry above. If the
    // PoW is solved but no real interaction arrives, revealFallback() swaps the
    // progress view for a "verify I'm human" checkbox. The click — and the pointer
    // movement to reach it — supplies the telemetry the server scores. No third
    // party is involved. Only offered when the zone opts in (INTERACTIVE === 1).
    var fallbackShown = false;
    function revealFallback() {
      if (fallbackShown || submitted || INTERACTIVE !== 1 || TIER !== 2) { return; }
      fallbackShown = true;
      document.getElementById("progressWrap").style.display = "none";
      verifyBox.style.display = "block";
    }
    if (TIER === 2 && INTERACTIVE === 1) {
      verifyCheckbox.addEventListener("click", function () {
        if (submitted) { return; }
        verifyBox.className = "verify-box checking";
        verifyLabel.textContent = VERIFY_CHECKING;
        maybeSubmit();
      });
      // Safety net: if the passive attempt hasn't completed shortly after load,
      // reveal the checkbox so there is always an explicit path forward.
      setTimeout(revealFallback, 2500);
    }

    function now() {
      return (window.performance && performance.now) ? performance.now() : Date.now();
    }

    function onMove(x, y) {
      var b = behavior, t = now();
      if (b.first === null) { b.first = t; b.startX = x; b.startY = y; }
      if (b.lastX !== null) {
        var dx = x - b.lastX, dy = y - b.lastY;
        b.pathLength += Math.sqrt(dx * dx + dy * dy);
      }
      if (b.lastT !== null) { b.dts.push(t - b.lastT); }
      b.lastT = t; b.lastX = x; b.lastY = y; b.endX = x; b.endY = y; b.last = t; b.count++;
      maybeSubmit();
    }

    function snapshot() {
      var b = behavior, jitter = 0;
      if (b.dts.length > 1) {
        var sum = 0, i;
        for (i = 0; i < b.dts.length; i++) { sum += b.dts[i]; }
        var mean = sum / b.dts.length, varsum = 0;
        for (i = 0; i < b.dts.length; i++) { var d = b.dts[i] - mean; varsum += d * d; }
        jitter = Math.sqrt(varsum / b.dts.length);
      }
      var sdx = b.endX - b.startX, sdy = b.endY - b.startY;
      return {
        event_count: b.count,
        path_length: b.pathLength,
        straight_line: Math.sqrt(sdx * sdx + sdy * sdy),
        duration_ms: Math.round((b.last || b.first || 0) - (b.first || 0)),
        time_to_first_ms: Math.round((b.first || b.startedAt) - b.startedAt),
        timing_jitter_ms: jitter
      };
    }

    var solvedCounter = null;
    var submitted = false;
    function maybeSubmit() {
      if (submitted || solvedCounter === null) { return; }
      if (TIER === 2 && (!behavior || behavior.count < MIN_EVENTS)) {
        // PoW solved but no real interaction yet — offer the manual fallback.
        revealFallback();
        return;
      }
      submitted = true;
      submitSolution(solvedCounter, (TIER === 2) ? snapshot() : null);
    }

    // ── Web Worker (inline blob) ───────────────────────
    var workerCode = function() {
      self.onmessage = async function(e) {
        var nonce = e.data.nonce;
        var difficulty = e.data.difficulty;
        var batchSize = e.data.batchSize;

        var nonceBytes = new Uint8Array(nonce.length / 2);
        for (var i = 0; i < nonce.length; i += 2) {
          nonceBytes[i / 2] = parseInt(nonce.substr(i, 2), 16);
        }

        var counter = 0;
        var found = false;

        while (!found) {
          for (var j = 0; j < batchSize; j++) {
            var buf = new ArrayBuffer(nonceBytes.length + 8);
            var view = new Uint8Array(buf);
            view.set(nonceBytes, 0);

            var c = counter;
            for (var k = 7; k >= 0; k--) {
              view[nonceBytes.length + k] = c & 0xff;
              c = Math.floor(c / 256);
            }

            var hash = await crypto.subtle.digest("SHA-256", buf);
            var hashBytes = new Uint8Array(hash);

            var zeros = 0;
            for (var b = 0; b < hashBytes.length; b++) {
              if (hashBytes[b] === 0) {
                zeros += 8;
              } else {
                var byte = hashBytes[b];
                while ((byte & 0x80) === 0 && zeros < 256) {
                  zeros++;
                  byte <<= 1;
                }
                break;
              }
            }

            if (zeros >= difficulty) {
              var hex = "";
              var cv = counter;
              for (var h = 0; h < 16; h++) {
                hex = "0123456789abcdef"[cv & 0xf] + hex;
                cv = Math.floor(cv / 16);
              }
              self.postMessage({ type: "solved", counter: hex });
              found = true;
              break;
            }
            counter++;
          }

          if (!found) {
            self.postMessage({ type: "progress", iterations: counter });
          }
        }
      };
    };

    var blob = new Blob(
      ["(" + workerCode.toString() + ")()"],
      { type: "application/javascript" }
    );
    var worker = new Worker(URL.createObjectURL(blob));

    worker.onmessage = function(e) {
      var msg = e.data;
      if (msg.type === "progress") {
        var pct = Math.min(90, (msg.iterations / 2000000) * 100);
        fill.style.width = pct + "%";
      } else if (msg.type === "solved") {
        fill.style.width = "100%";
        fill.classList.remove("solving");
        status.textContent = "{status_redirecting}";
        status.className = "status-text success";
        solvedCounter = msg.counter;
        if (TIER === 2 && (!behavior || behavior.count < MIN_EVENTS)) {
          status.textContent = "{status_almost}";
          status.className = "status-text";
        }
        maybeSubmit();
      }
    };

    worker.onerror = function() {
      status.textContent = "{status_error}";
      status.className = "status-text error";
    };

    worker.postMessage({ nonce: NONCE, difficulty: DIFFICULTY, batchSize: BATCH_SIZE });

    // ── Submit solution ────────────────────────────────
    function submitSolution(counterHex, behaviorData) {
      prompt.style.display = "none";
      status.textContent = "{status_redirecting}";
      status.className = "status-text success";
      var xhr = new XMLHttpRequest();
      xhr.open("POST", VERIFY_URL, true);
      xhr.setRequestHeader("Content-Type", "application/json");
      xhr.onload = function() {
        if (xhr.status === 200) {
          if (TIER === 2 && INTERACTIVE === 1) {
            verifyBox.className = "verify-box done";
            verifyLabel.textContent = VERIFY_DONE;
          }
          setTimeout(function() { location.reload(); }, 500);
        } else {
          status.textContent = "{status_failed_retry}";
          status.className = "status-text error";
          setTimeout(function() { location.reload(); }, 2000);
        }
      };
      xhr.onerror = function() {
        status.textContent = "{status_conn_retry}";
        status.className = "status-text error";
        setTimeout(function() { location.reload(); }, 2000);
      };
      var payload = { nonce: NONCE, counter: counterHex };
      if (behaviorData) { payload.behavior = behaviorData; }
      xhr.send(JSON.stringify(payload));
    }
  })();
  </script>
</body>
</html>
