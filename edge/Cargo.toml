[package]
name = "veil-edge"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ipnet = "2"
regex = "1"
maxminddb = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Challenge engine (Phase 4 — PoW + HMAC tokens)
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
getrandom = "0.3"
dotenvy = "0.15"

# Distributed rate limiting (Phase 2.5) — shared sliding-window counters
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }

# TLS termination (Phase 2.2)
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"

[dev-dependencies]
rcgen = "0.13"
