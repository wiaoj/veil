[package]
name = "veil-pow-wasm"
version = "0.1.0"
edition = "2021"
description = "SHA-256 Proof-of-Work solver compiled to WASM for Veil Edge challenge pages"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
sha2 = "0.10"

[dev-dependencies]
hex-literal = "0.4"

[profile.release]
opt-level = "s"
lto = true
