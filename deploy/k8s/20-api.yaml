apiVersion: apps/v1
kind: Deployment
metadata:
  name: veil-api
  namespace: veil
  labels:
    app.kubernetes.io/name: veil-api
    app.kubernetes.io/part-of: veil
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: veil-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: veil-api
    spec:
      containers:
        - name: api
          image: veil-api:latest
          ports:
            - name: http
              containerPort: 8080
          # Non-secret settings: ClickHouse endpoint for the analytics read API
          # and the edge-node discovery mode used by config sync.
          envFrom:
            - configMapRef:
                name: veil-config
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ConnectionStrings__Default
              valueFrom:
                secretKeyRef:
                  name: veil-secrets
                  key: ConnectionStrings__Default
            - name: ConfigSync__PushHmacKey
              valueFrom:
                secretKeyRef:
                  name: veil-secrets
                  key: ConfigSync__PushHmacKey
            - name: Auth__SigningKey
              valueFrom:
                secretKeyRef:
                  name: veil-secrets
                  key: Auth__SigningKey
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: veil-api
  namespace: veil
spec:
  selector:
    app.kubernetes.io/name: veil-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: veil-api
  namespace: veil
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: veil-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
