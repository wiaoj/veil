name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  edge:
    name: Edge (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: edge
      - run: cargo test
      - run: cargo clippy -- -D warnings
        continue-on-error: true

  control-plane:
    name: Control plane (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: veil
      # The solution references ../libraries by relative path.
      - uses: actions/checkout@v4
        with:
          repository: wiaoj/libraries
          path: libraries
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Veil.slnx
        working-directory: veil

  dashboard:
    name: Dashboard (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
